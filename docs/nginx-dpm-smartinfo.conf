# Ausschnitt für denselben vHost wie die Symfony-App.
# Die Website bleibt normal erreichbar; nur /tv.html ist der SmartInfo-Entry.
#
# Beispiel: server_name dpm.drk-coe.de;
#           root /var/www/html/kita-manager.timothy-roth.de/public;
#
# public/tv.html kommt mit dem Deploy. try_files $uri liefert sie als Statik.
# Kein separates root nur fürs Gadget nötig.
#
# Am server-Block bitte KEIN: add_header X-Frame-Options SAMEORIGIN;
# (sonst blockiert das iframe /slider/display in manchen Setups;
#  für same-origin iframe ist SAMEORIGIN ok — cross-origin Entry nicht)

server {
    listen 80;
    listen [::]:80;
    server_name dpm.drk-coe.de;

    root /var/www/html/kita-manager.timothy-roth.de/public;
    index index.php;

    add_header X-Content-Type-Options nosniff;
    client_max_body_size 120M;

    # Explizit (optional — try_files $uri reicht meist schon)
    location = /tv.html {
        default_type text/html;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location ~ /\.ht {
        deny all;
    }
}
