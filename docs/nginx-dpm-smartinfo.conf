# Minimaler SmartInfo-Entry: nur das HTML-Gadget mit iframe.
# SmartInfo-URL z.B.: http://dpm.timothy-roth.de/
# Das iframe darin lädt den Kitamanager (siehe smart-tv-html-gadget.html).
#
# Datei auf dem Server:
#   /var/www/html/dpm/smart-tv-html-gadget.html

server {
    listen 80;
    listen [::]:80;
    server_name dpm.timothy-roth.de;

    root /var/www/html/dpm;
    index smart-tv-html-gadget.html;

    # Kein X-Frame-Options / kein frame-ancestors — sonst blockieren
    # file:// / SmartInfo-Rahmen das Einbetten.
    add_header X-Content-Type-Options nosniff;

    # Alles zeigt auf das Gadget; keine PHP-App hier.
    location / {
        try_files /smart-tv-html-gadget.html =404;
    }

    location = /smart-tv-html-gadget.html {
        default_type text/html;
    }

    location ~ /\. {
        deny all;
    }
}
