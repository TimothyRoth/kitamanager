# tv-dpm.drk-coe.de  → SmartInfo / Fernseher (nur statisches HTML)
# dpm.drk-coe.de     → normale Website + /slider/display (Symfony)
#
# DNS (VPN/intern): beide Namen auf denselben Server (oder getrennte IPs).
# Beide unter Zone drk-coe.de — kein extra TLD nötig.

# === TV-Entry ===
server {
    listen 80;
    listen [::]:80;
    server_name tv-dpm.drk-coe.de;

    root /var/www/html/dpm-entry;
    index smart-tv-html-gadget.html;

    add_header X-Content-Type-Options nosniff;

    location / {
        try_files /smart-tv-html-gadget.html =404;
    }

    location = /smart-tv-html-gadget.html {
        default_type text/html;
    }

    location ~ /\. {
        deny all;
    }
}

# === App (alle Geräte / Browser) ===
# KEIN add_header X-Frame-Options SAMEORIGIN;
server {
    listen 80;
    listen [::]:80;
    server_name dpm.drk-coe.de;

    root /var/www/html/kita-manager.timothy-roth.de/public;
    index index.php;

    add_header X-Content-Type-Options nosniff;
    client_max_body_size 120M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location ~ /\.ht {
        deny all;
    }
}
