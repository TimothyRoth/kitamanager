; Per-image upload limit. The app enforces 3M (Symfony constraint); this is a
; slightly higher hard cap so the app-level check produces the friendly error.
upload_max_filesize = 4M
; Total request body: must fit the sum of all images in one bulk upload.
; The per-image limit is what matters; this allows ~35 images of 3M each.
post_max_size = 110M
memory_limit = 256M
