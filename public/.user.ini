; Per-image upload limit. The app rejects originals above 25M (Symfony
; constraint + endpoint check); this is a slightly higher hard cap so the
; app-level check produces the friendly error message.
upload_max_filesize = 26M
; Bulk uploads send ONE image per request (AJAX loop), so the request body
; only ever has to fit a single image. Keeping this small is the actual
; protection against out-of-memory during uploads.
post_max_size = 30M
; Headroom for image processing; the megapixel guard in ImageDownscaler
; bounds how large a single decoded image can get.
memory_limit = 512M
